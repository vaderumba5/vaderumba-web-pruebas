name: Ajustar web móvil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar HTML y estilos móviles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://raw.githubusercontent.com/vaderumba5/va_de_rumba_app/main/assets/images/va_de_rumba_logo.png', 'vr-logo-dorado.png')
          marker = '</style>'
          css = r'''
    /* Ajuste móvil específico */
    @media(max-width:680px){
      html,body{overflow-x:hidden}
      .container,.header-inner{width:min(calc(100% - 32px),var(--max))}
      .header{height:64px}.logo{height:54px}.logo img{height:44px;max-width:70px}.logo-name-top{font-size:13px}.logo-name-bottom{font-size:17px}.menu-btn{width:42px;height:42px}
      .hero{height:auto;min-height:0;max-height:none;display:block;background:#090909;overflow:visible}
      .hero-media{position:relative;inset:auto;width:100%;height:auto;aspect-ratio:1448/687;background:url("portada.jpeg") center center/contain no-repeat;transform:none!important;filter:none!important;will-change:auto}
      .hero-media::before,.hero-media::after,.hero::after{display:none}
      .hero-content{position:relative;left:auto;bottom:auto;transform:none;width:100%;padding:26px 20px 28px;display:block}
      .hero-content::before{display:none}
      .hero h1.hero-title{font-size:clamp(48px,16vw,68px);line-height:.84;margin:0 0 18px;max-width:100%;word-break:normal}
      .hero-bottom{padding-top:14px;display:flex;flex-direction:column;align-items:stretch;gap:18px}
      .hero-copy{font-size:17px;line-height:1.4;margin:0}
      .hero-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .hero-actions .btn{width:100%;min-width:0;padding:0 12px;font-size:11px;white-space:nowrap}
      .section{padding:64px 0}
      h2{font-size:clamp(46px,14vw,72px);line-height:.9;overflow-wrap:anywhere}
      .statement h2,.band h2{font-size:clamp(50px,15vw,78px)}
      .section-head{gap:22px;margin-bottom:32px}
      .section-head p,.statement-copy p,.band-intro p,.booking p,.live-bottom p{font-size:17px;line-height:1.55}
      .next-show,.next-show-inner{min-height:520px}.next-show-inner{padding:22px}.next-date{font-size:52px}.next-content h3{font-size:28px}
      .date-row{grid-template-columns:68px 1fr 24px;gap:10px}.date-row time{font-size:18px}.date-row strong{font-size:13px}
      .track{aspect-ratio:1.08;padding:18px}.track h3{font-size:42px}
      .live-section{min-height:620px;background-position:center}.live-section .container{padding-bottom:38px}.live-section h2{font-size:clamp(72px,22vw,118px)}
      .stats{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat strong{font-size:27px}
      .members{grid-template-columns:1fr 1fr}.member-caption{padding:48px 12px 12px}.member-caption strong{font-size:16px}
      .gallery{grid-template-rows:280px 220px 220px 220px}
      .social-card{min-height:210px;padding:22px}.social-card strong{font-size:clamp(40px,12vw,58px);overflow-wrap:anywhere}
      .booking-grid{gap:34px}
      footer{padding:28px 0}.footer-logo img{height:64px;max-width:100px}
    }
    @media(max-width:430px){
      .hero-content{padding-left:16px;padding-right:16px}
      .hero h1.hero-title{font-size:clamp(44px,15.5vw,60px)}
      .hero-actions{grid-template-columns:1fr 1fr}
      .hero-actions .btn{min-height:48px;font-size:10px;letter-spacing:.06em}
      h2{font-size:clamp(42px,13.5vw,62px)}
      .statement h2,.band h2{font-size:clamp(46px,14vw,68px)}
      .social-card strong{font-size:clamp(36px,11vw,48px)}
    }
'''
          if '/* Ajuste móvil específico */' not in s:
              s = s.replace(marker, css + '\n  ' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Corregir portada y textos en móvil"
            git push
          fi
